name: Keep Streamlit App Awake
on:
  schedule:
    - cron: '0 0 */3 * *' # Runs every 3 days at midnight
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Push empty commit to keep repo active
        run: |
          git config --global user.name 'Keep-alive Bot'
          git config --global user.email 'bot@example.com'
          git commit --allow-empty -m "chore: keep-alive commit to prevent app sleep"
          git push
